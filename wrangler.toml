name = "cdn-blueat-worker"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
PLC_DIRECTORY = "https://plc.directory"
CACHE_MAX_AGE_SECONDS = 604800

# To serve the custom domain instead of the `workers.dev` subdomain:
# - set `workers_dev = false`
# - set `route` and `zone_id`
#
# Example:
# workers_dev = false
# route = "cdn.blueat.net/*"
# zone_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

